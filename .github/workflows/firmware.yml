name: Build Firmware

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'ESP32_Air_Suspension.ino'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Extract firmware version
        id: ver
        run: |
          VERSION=$(sed -n 's/#define FW_VERSION "\(.*\)"/\1/p' ESP32_Air_Suspension.ino)
          if [ -z "$VERSION" ]; then
            echo "FW_VERSION not found in sketch" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Firmware version: $VERSION"

      - name: Compile sketch
        run: |
          # arduino-cli requires the sketch folder name to match the .ino name
          mkdir -p build/ESP32_Air_Suspension
          cp ESP32_Air_Suspension.ino build/ESP32_Air_Suspension/
          arduino-cli compile --fqbn esp32:esp32:esp32s3 --output-dir out build/ESP32_Air_Suspension
          cp out/ESP32_Air_Suspension.ino.bin firmware.bin
          ls -l firmware.bin

      - name: Check size fits the OTA app partition
        run: |
          # Default 4MB partition scheme gives two 1280KB OTA app slots
          SIZE=$(stat -c%s firmware.bin)
          echo "firmware.bin is $SIZE bytes (limit 1310720)"
          if [ "$SIZE" -gt 1310720 ]; then
            echo "Firmware too large for the OTA partition — it would brick the self-update path" >&2
            exit 1
          fi

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG exists — replacing firmware.bin"
            gh release upload "$TAG" firmware.bin --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" firmware.bin \
              --title "Firmware $TAG" \
              --notes "Auto-built from ${GITHUB_SHA}" \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          fi
